name: Build XiaoBei APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 34 平台
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 安装 Gradle 8.6 并执行编译
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: 编译 APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaobei-Assistant-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
